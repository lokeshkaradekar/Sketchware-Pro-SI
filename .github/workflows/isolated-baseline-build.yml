
name: Isolated Baseline Build

on:
  workflow_dispatch:
  push:
    branches:
      - wip/isolated-baseline-build

permissions:
  contents: read

concurrency:
  group: isolated-baseline-build
  cancel-in-progress: false

jobs:
  build:
    name: Build baseline APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create temporary mock Google Services config
        shell: bash
        run: |
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "sketchware-build-only",
              "storage_bucket": "sketchware-build-only.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "pro.sketchware"
                  }
                },
                "api_key": [
                  {
                    "current_key": "BUILD_ONLY_DUMMY_KEY"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-baseline-build-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            build.log
          if-no-files-found: warn
          retention-days: 7
          
